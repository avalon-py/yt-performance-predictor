name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: yt-performance-predictor-api:ci
          load: true          # loads the built image into the local docker daemon
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start API container
        run: |
          docker run -d \
            --name api-ci \
            -p 8000:8000 \
            -e MODEL_BUNDLE_PATH=/app/models/bundles/latest_clip_b32_clip.pt \
            -v ${{ github.workspace }}/models/bundles:/app/models/bundles:ro \
            yt-performance-predictor-api:ci

      - name: Wait for API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "API is up"
              exit 0
            fi
            echo "Waiting for API... ($i)"
            sleep 2
          done
          echo "API did not become healthy in time"
          docker logs api-ci
          exit 1

      - name: Smoke test /health
        run: |
          curl -sf http://localhost:8000/health | tee health_response.json
          grep -q '"status":"ok"' health_response.json

      - name: Smoke test /predict
        run: |
          curl -sf -X POST http://localhost:8000/predict \
            -F "thumbnail=@tests/fixtures/sample_thumbnail.jpg" \
            -F "title=Test Video Title" \
            -F "subscriber_count_at_upload=10000" \
            -F "trailing_avg_views=5000" \
            -F "duration_seconds=600" \
            -F "genre=Entertainment" \
            | tee predict_response.json
          grep -q '"expected_views"' predict_response.json

      - name: Dump logs on failure
        if: failure()
        run: docker logs api-ci

      - name: Clean up
        if: always()
        run: docker rm -f api-ci || true